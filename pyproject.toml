[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temprun"
version = "0.1.0"
description = "A small durable agent execution runtime for learning Temporal"
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["temprun*"]
